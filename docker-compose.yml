services:
  postgres:
    image: postgres:18-alpine
    container_name: tictactoe-db
    restart: unless-stopped
    env_file:
      - ./backend/.env 
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    name: tictactoe_postgres_data
