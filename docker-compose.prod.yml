services:
  postgres:
    env_file:
      - ./backend/.env.production
    ports: []

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env.production
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
