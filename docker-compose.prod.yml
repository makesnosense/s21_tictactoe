services:
  postgres:
    ports: []  
    networks:
      - internal  # only backend can reach it

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tictactoe-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./backend/.env
        required: true
    depends_on:
      - postgres
    networks:
      - web      # nginx can reach backend
      - internal # backend can reach postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tictactoe-frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m" 
        max-file: "5"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend
    networks:
      - web  # nginx can reach frontend

networks:
  web:
    external: true
  internal:

volumes:
  postgres_data:
    name: tictactoe_postgres_data
