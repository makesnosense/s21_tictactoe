services:
  postgres:
    ports: []  

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tictactoe-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./backend/.env
        required: true
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tictactoe-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
